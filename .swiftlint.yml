disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unused_import
  - unused_declaration

included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - Example/PayabliDemo/build

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_function_declarations: true

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length: 2
  excluded:
    - id
    - ok
    - to

reporter: "xcode"
