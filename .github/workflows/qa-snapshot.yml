name: QA snapshot

# Tags `<PayabliCore.version>-QA.<yyyyMMddHHmmss>` on the commit this runs from, after the suite passes, so
# somebody outside the change can pin a pre-release exactly. On demand only: a tag is visible to everyone who
# clones the repository, so a build nobody consumes gets none. No GitHub Release, and these tags are prunable.
# `release.yml` is the release counterpart; .github/RELEASING.md is the procedure.

on:
  workflow_dispatch:

concurrency:
  group: qa-snapshot
  cancel-in-progress: false

jobs:
  publish:
    name: Publish a QA snapshot
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      # No credential is left in `.git/config`, so the code under test cannot push. Only the step that
      # publishes is handed one.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        run: |
          VERSION="$(.github/scripts/release-version.sh qa "$GITHUB_REF")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tagging $VERSION"

      - name: Check tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - uses: ./.github/actions/ios-toolchain

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Test
        run: |
          # The same hardware-only exclusions every other workflow that tests this scheme applies, from
          # the same file. This job tests and then tags, so without them a release is cut off a run that
          # reported standing skips.
          # The status is checked before the output is parsed. `read` succeeds on a here-string
          # whatever the command substitution inside it returned, so the failure would be dropped and
          # the array left empty: the step would then run the hardware-only tests with no exclusions
          # and pass, which is the silent skip this whole list exists to prevent. Fail closed.
          if ! exclusions="$(.github/scripts/hardware-only-skips.sh)"; then
              echo "::error::the hardware-only exclusion list could not be read"
              exit 1
          fi
          # Into an array rather than expanded unquoted, so the arguments split exactly where the list
          # says and nowhere else. An empty list leaves an empty array, which expands to nothing.
          read -r -a skips <<< "$exclusions"
          xcodebuild test \
            -scheme PayabliSDK-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -clonedSourcePackagesDirPath .build/checkouts \
            ${skips[@]+"${skips[@]}"} \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Create and push tag
        env:
          PUSH_TOKEN: ${{ secrets.GHB_PAT_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Payabli iOS SDK $VERSION" "$GITHUB_SHA"
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "refs/tags/$VERSION"
