name: Release

# A consumer resolves this package by git tag, so the tag is the publication. This one cuts
# `PayabliCore.version` from the commit on main that the dispatch names, after the suite passes on it, and
# gives it a GitHub Release carrying the XCFrameworks for integrators who do not use SwiftPM. Only a release
# is ever tagged.
#
# Four jobs. `check` reads the named commit and its version. `test` and `build` then run beside each other,
# each with a read-only token and no secret, so "Re-run failed jobs" repeats a failed suite without rebuilding
# the XCFrameworks. `publish` runs on a fresh runner in the `release` environment, executes no file from the
# checkout, and is the only job that can read the deploy key.

on:
  workflow_dispatch:
    inputs:
      # The commit that ships, so a merge landing between the decision and the dispatch is not released.
      commit:
        description: "Full 40-character SHA of the commit on main to release"
        required: true
        type: string
      release_notes:
        description: "Release notes (markdown), published as the release body"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Reads the commit and the version, and holds nothing that can tag or publish.
  check:
    name: Check the commit can be released
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ inputs.commit }}
    env:
      COMMIT: ${{ inputs.commit }}

    steps:
      # A full SHA and nothing shorter, so the commit approved is not a prefix that resolves to another.
      - name: Check the commit is named in full
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::a release names the full 40-character commit SHA, not '$COMMIT'"
            exit 1
          fi

      # Nothing is published from a commit whose CI on main has not passed, and a run still in progress has
      # not.
      - name: Require a passing CI run on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&branch=main&event=push&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion)"')"
          if [ "$state" != "completed success" ]; then
            echo "::error::CI on main for $COMMIT is '${state:-not run}', not a completed success. Re-run it, then dispatch again."
            exit 1
          fi

      # All of history, so the check below can see main.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit is on main
        run: |
          if [ "$(git merge-base "$COMMIT" origin/main)" != "$COMMIT" ]; then
            echo "::error::$COMMIT is not on main"
            exit 1
          fi

      - name: Check the version
        id: version
        run: |
          VERSION="$(.github/scripts/release-version.sh "$GITHUB_REF")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tagging $VERSION"
          # On the run's page, so the approver sees what the approval releases.
          {
            echo "Releasing \`$VERSION\` from \`$COMMIT\`:"
            echo
            echo "> $(git log -1 --format=%s "$COMMIT")"
            echo
            echo "The workflow runs from \`$GITHUB_SHA\` on main."
          } >> "$GITHUB_STEP_SUMMARY"

      # A tag on this commit is a run that failed after pushing it, and is resumed.
      - name: Check an existing tag names this commit
        run: |
          tagged="$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}" || true)"
          if [ -n "$tagged" ] && [ "$tagged" != "$COMMIT" ]; then
            echo "::error::tag $VERSION already names $tagged, not $COMMIT"
            exit 1
          fi

      # A version below the newest release would be published after it. The lines are release-newer.sh's,
      # carried here because the commit checked out may predate that file.
      - name: Check the version is not below the newest release
        run: |
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tags="$(git for-each-ref --format='%(refname:strip=2)' refs/tags)"
          newest="$(printf '%s\n' "$tags" | { grep -E "$release" || true; } | sort -V | tail -n 1)"
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::the newest release is $newest, and $VERSION is lower"
            exit 1
          fi

  # The suite, on its own so a failed test is re-run without rebuilding the XCFrameworks.
  test:
    name: Test the release
    needs: check
    # The same image as the build job, so the release is tested on the Xcode it
    # builds its XCFrameworks with.
    runs-on: xcode-27
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/ios-toolchain

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Test
        run: |
          # The same hardware-only exclusions every other workflow that tests this scheme applies, from
          # the same file. The release tags what this job tested, so without them a release is cut off a
          # run that reported standing skips.
          # The status is checked before the output is parsed. `read` succeeds on a here-string
          # whatever the command substitution inside it returned, so the failure would be dropped and
          # the array left empty: the step would then run the hardware-only tests with no exclusions
          # and pass, which is the silent skip this whole list exists to prevent. Fail closed.
          if ! exclusions="$(.github/scripts/hardware-only-skips.sh)"; then
              echo "::error::the hardware-only exclusion list could not be read"
              exit 1
          fi
          # Into an array rather than expanded unquoted, so the arguments split exactly where the list
          # says and nowhere else. An empty list leaves an empty array, which expands to nothing.
          read -r -a skips <<< "$exclusions"
          xcodebuild test \
            -scheme PayabliSDK-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -clonedSourcePackagesDirPath .build/checkouts \
            ${skips[@]+"${skips[@]}"} \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

  # The XCFrameworks, beside the suite rather than after it. Publish uploads what this job built, so a re-run
  # of the suite alone leaves them as they are.
  build:
    name: Build the release
    needs: check
    # The XCFramework build needs the Xcode this image ships; the test job runs
    # on the same image so a release is gated on the Xcode it builds with.
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/ios-toolchain

      - name: Build the XCFrameworks
        timeout-minutes: 45
        run: ./Scripts/build_release_frameworks.sh

      # Kept past the 30 days in which GitHub allows a run to be re-run, so a re-run of the suite still finds
      # these files to publish. Replaced when this job itself is re-run, since an artifact name is written once.
      - name: Hand the release files to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            build/release/payabli-ios-sdk-${{ needs.check.outputs.version }}.zip
            build/release/checksums.txt
            build/release/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  publish:
    name: Publish a release
    needs: [check, test, build]
    runs-on: ubuntu-latest
    # Its required reviewers are who may release, it deploys from main only, and it holds the one key the
    # tag ruleset lets create a tag.
    environment: release
    permissions:
      contents: write

    env:
      # Through the environment, so the text is never parsed as shell.
      RELEASE_NOTES: ${{ inputs.release_notes }}
      BUILT_VERSION: ${{ needs.check.outputs.version }}
      COMMIT: ${{ needs.check.outputs.commit }}

    steps:
      - name: Check the release key is provisioned
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::the release environment has no RELEASE_DEPLOY_KEY secret"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      # The version is the check job's output, set before any test or build ran. It and the commit are
      # checked here as data, since no file from the checkout runs where the key is.
      - name: Check the version
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the build reported '$COMMIT', which is not a full commit SHA"
            exit 1
          fi
          if ! [[ "$BUILT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the build reported '$BUILT_VERSION', which is not <major>.<minor>.<patch>"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a release is cut from refs/heads/main, not $GITHUB_REF"
            exit 1
          fi
          VERSION="$BUILT_VERSION"
          tagged="$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}" || true)"
          if [ -n "$tagged" ] && [ "$tagged" != "$COMMIT" ]; then
            echo "::error::tag $VERSION already names $tagged, not $COMMIT"
            exit 1
          fi
          # "Re-run failed jobs" does not re-run the check job, so a release cut since it ran is looked for
          # here. The same lines as release-newer.sh.
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tags="$(git for-each-ref --format='%(refname:strip=2)' refs/tags)"
          newest="$(printf '%s\n' "$tags" | { grep -E "$release" || true; } | sort -V | tail -n 1)"
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::the newest release is $newest, and $VERSION is lower"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAGGED=$tagged" >> "$GITHUB_ENV"

      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: build/release

      # A draft carries the assets and needs no tag. The tag is then pushed with the deploy key, the only
      # identity the tag ruleset lets create one, and the draft is published onto it. A run that failed part
      # way is resumed: a draft on this commit gets its assets again, a tag on this commit is not pushed
      # twice, and a published release or a draft on another commit is refused.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          # Notes are written for the release, because commit subjects carry
          # tracker references no release page should name.
          if [ -z "$RELEASE_NOTES" ]; then
            echo "::error::release_notes is empty, and a release is published with notes written for it"
            exit 1
          fi
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          bundle="build/release/payabli-ios-sdk-$VERSION.zip"
          if [ ! -f "$bundle" ]; then
            echo "::error::no $bundle"
            exit 1
          fi
          assets=("$bundle" build/release/checksums.txt build/release/THIRD_PARTY_LICENSES.txt)
          if ! existing="$(gh release view "$VERSION" --json isDraft,targetCommitish \
              --jq '"\(.isDraft) \(.targetCommitish)"' 2>&1)"; then
            case "$existing" in
              *"release not found"*) existing="" ;;
              *) echo "::error::could not read release $VERSION: $existing"; exit 1 ;;
            esac
          fi
          case "$existing" in
            "")
              gh release create "$VERSION" --draft --target "$COMMIT" \
                --title "Payabli iOS SDK $VERSION" --notes-file release-notes.md "${assets[@]}"
              ;;
            "true $COMMIT")
              gh release upload "$VERSION" --clobber "${assets[@]}"
              ;;
            "false "*)
              echo "::error::release $VERSION is already published"
              exit 1
              ;;
            *)
              echo "::error::draft $VERSION targets '${existing#* }', not $COMMIT; delete it"
              exit 1
              ;;
          esac

          # GitHub's host keys come from its API over HTTPS, so the SSH connection is verified rather than
          # trusted on first use.
          umask 077
          key="$RUNNER_TEMP/release-key"
          hosts="$RUNNER_TEMP/github-known-hosts"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$TAGGED" ]; then
            git tag -a "$VERSION" -m "Payabli iOS SDK $VERSION" "$COMMIT"
            GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts" \
              git push "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/$VERSION"
          fi

          gh release edit "$VERSION" --draft=false
