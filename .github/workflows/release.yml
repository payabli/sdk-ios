name: Release

# A consumer resolves this package by git tag, so the tag is the publication. This one cuts
# `PayabliCore.version` from main, after the suite passes, on the commit that was tested, and gives it a
# GitHub Release carrying the XCFrameworks for integrators who do not use SwiftPM. Only a release is ever
# tagged. .github/RELEASING.md is the procedure.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes (markdown)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish a release
    runs-on: macos-15
    # Its required reviewers are who may release, it deploys from main only, and it holds the one key the
    # tag ruleset lets create a tag.
    environment: release
    permissions:
      contents: write
      actions: read

    env:
      # Through the environment, so the text is never parsed as shell.
      RELEASE_NOTES: ${{ inputs.release_notes }}

    steps:
      # Nothing is published from a commit whose CI has not passed, and a run still in progress has not.
      - name: Require a passing CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion)"')"
          if [ "$state" != "completed success" ]; then
            echo "::error::CI on $GITHUB_SHA is '${state:-not run}', not a completed success"
            exit 1
          fi

      - name: Check the release key is provisioned
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::the release environment has no RELEASE_DEPLOY_KEY secret; .github/RELEASING.md sets it up"
            exit 1
          fi

      # No credential is left in `.git/config`, so the code under test cannot push. Only the step that
      # publishes is handed one.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        run: |
          VERSION="$(.github/scripts/release-version.sh "$GITHUB_REF")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tagging $VERSION"

      - name: Check tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - uses: ./.github/actions/ios-toolchain

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Test
        run: |
          # The same hardware-only exclusions every other workflow that tests this scheme applies, from
          # the same file. This job tests and then tags, so without them a release is cut off a run that
          # reported standing skips.
          # The status is checked before the output is parsed. `read` succeeds on a here-string
          # whatever the command substitution inside it returned, so the failure would be dropped and
          # the array left empty: the step would then run the hardware-only tests with no exclusions
          # and pass, which is the silent skip this whole list exists to prevent. Fail closed.
          if ! exclusions="$(.github/scripts/hardware-only-skips.sh)"; then
              echo "::error::the hardware-only exclusion list could not be read"
              exit 1
          fi
          # Into an array rather than expanded unquoted, so the arguments split exactly where the list
          # says and nowhere else. An empty list leaves an empty array, which expands to nothing.
          read -r -a skips <<< "$exclusions"
          xcodebuild test \
            -scheme PayabliSDK-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -clonedSourcePackagesDirPath .build/checkouts \
            ${skips[@]+"${skips[@]}"} \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Build the XCFrameworks
        timeout-minutes: 45
        run: ./Scripts/build_release_frameworks.sh

      # A draft carries the assets and needs no tag. The tag is then pushed with the deploy key, the only
      # identity the tag ruleset lets create one, and the draft is published onto it. A failure before the
      # push leaves at most a draft; one after it leaves a tag whose draft `gh release edit` publishes.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          previous="$(git tag --list '[0-9]*' --sort=-version:refname | head -n 1 || true)"
          {
            if [ -n "$RELEASE_NOTES" ]; then
              printf '%s\n\n' "$RELEASE_NOTES"
            fi
            echo "## Changes since ${previous:-the first commit}"
            if [ -n "$previous" ]; then
              git log -n 50 --pretty=format:"- %s" "$previous..$GITHUB_SHA"
            else
              git log -n 50 --pretty=format:"- %s" "$GITHUB_SHA"
            fi
          } > release-notes.md
          shopt -s nullglob
          zips=(build/release/payabli-ios-sdk-*-"$VERSION".zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::no XCFramework zips in build/release"
            exit 1
          fi
          gh release create "$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Payabli iOS SDK $VERSION" --notes-file release-notes.md \
            "${zips[@]}" build/release/checksums.txt build/release/THIRD_PARTY_LICENSES.txt

          # GitHub's host keys come from its API over HTTPS, so the SSH connection is verified rather than
          # trusted on first use.
          umask 077
          key="$RUNNER_TEMP/release-key"
          hosts="$RUNNER_TEMP/github-known-hosts"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Payabli iOS SDK $VERSION" "$GITHUB_SHA"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts" \
            git push "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/$VERSION"

          gh release edit "$VERSION" --draft=false
