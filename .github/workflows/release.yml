name: Release

# A consumer resolves this package by git tag, so the tag is the publication. This one cuts
# `PayabliCore.version` from the commit the dispatch names, which is on the release or hotfix branch of that
# version and passed CI there, after the suite passes on it, and gives it a GitHub Release carrying the
# XCFrameworks for integrators who do not use SwiftPM. Only a release is ever tagged.
#
# Four jobs. `check` reads the named commit and its version. `test` and `build` then run beside each other,
# each with a read-only token and no secret, so "Re-run failed jobs" repeats a failed suite without rebuilding
# the XCFrameworks. `publish` runs on a fresh runner in the `release` environment, executes no file from the
# checkout, and is the only job that can read the deploy key.

on:
  workflow_dispatch:
    inputs:
      # The commit that ships, so a merge landing between the decision and the dispatch is not released.
      commit:
        description: "Full 40-character SHA of the commit to release, on release/<version> or hotfix/<version>"
        required: true
        type: string
      release_notes:
        description: "Release notes (markdown), published as the release body"
        required: true

jobs:
  # Reads the commit and the version, and holds nothing that can tag or publish.
  check:
    name: Check the commit can be released
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ inputs.commit }}
    env:
      COMMIT: ${{ inputs.commit }}

    steps:
      # The workflow's own definition is main's, so a dispatch from any other ref is refused before anything
      # else runs. The publish job refuses it again, and the release environment deploys from main only.
      - name: Check the release is dispatched from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a release is dispatched from refs/heads/main, not $GITHUB_REF"
            exit 1
          fi

      # A full SHA and nothing shorter, so the commit approved is not a prefix that resolves to another.
      - name: Check the commit is named in full
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::a release names the full 40-character commit SHA, not '$COMMIT'"
            exit 1
          fi

      # Notes are written for the release, because commit subjects carry tracker references no release page
      # should name. A run that cannot publish is refused here, before anyone is asked to approve it.
      - name: Check the release notes are written
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -z "${RELEASE_NOTES//[[:space:]]/}" ]; then
            echo "::error::release_notes is blank, and a release is published with notes written for it"
            exit 1
          fi

      # All of history, so the checks below can see every branch and every tag.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      # Main's copy of the script, reading the commit's tree as data. Nothing from the commit runs before the
      # checks below have found it on its branch with CI passed there.
      - name: Check the version
        id: version
        run: |
          git show "$GITHUB_SHA:.github/scripts/release-version.sh" > .github/scripts/release-version.sh
          VERSION="$(bash .github/scripts/release-version.sh "$GITHUB_REF")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tagging $VERSION"
          # On the run's page, so the approver sees what the approval releases.
          {
            echo "Releasing \`$VERSION\` from \`$COMMIT\`:"
            echo
            echo "> $(git log -1 --format=%s "$COMMIT")"
            echo
            echo "The workflow runs from \`$GITHUB_SHA\` on main."
          } >> "$GITHUB_STEP_SUMMARY"

      # The branch is named by the version the commit declares, so a commit on another version's branch, or
      # only on main, is refused rather than released under a number it was not worked as.
      - name: Check the commit is on its release or hotfix branch
        id: branch
        run: |
          branch=
          for candidate in "release/$VERSION" "hotfix/$VERSION"; do
            if git show-ref --verify --quiet "refs/remotes/origin/$candidate" \
                && git merge-base --is-ancestor "$COMMIT" "refs/remotes/origin/$candidate"; then
              branch="$candidate"
              break
            fi
          done
          if [ -z "$branch" ]; then
            echo "::error::$COMMIT is not on release/$VERSION or hotfix/$VERSION, the branches of the version it declares"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Nothing is published from a commit whose CI on its branch has not passed, and a run still in progress
      # has not.
      - name: Require a passing CI run on the branch for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&branch=$BRANCH&event=push&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion)"')"
          if [ "$state" != "completed success" ]; then
            echo "::error::CI on $BRANCH for $COMMIT is '${state:-not run}', not a completed success. Re-run it, then dispatch again."
            exit 1
          fi

      # A tag on this commit is a run that failed after pushing it, and is resumed.
      - name: Check an existing tag names this commit
        run: |
          tagged="$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}" || true)"
          if [ -n "$tagged" ] && [ "$tagged" != "$COMMIT" ]; then
            echo "::error::tag $VERSION already names $tagged, not $COMMIT"
            exit 1
          fi

      # A version below the newest release would be published after it. The lines are release-newer.sh's,
      # carried here because the commit checked out may predate that file.
      - name: Check the version is not below the newest release
        run: |
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tags="$(git for-each-ref --format='%(refname:strip=2)' refs/tags)"
          newest="$(printf '%s\n' "$tags" | { grep -E "$release" || true; } | sort -V | tail -n 1)"
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::the newest release is $newest, and $VERSION is lower"
            exit 1
          fi

      # Every earlier release is merged back into main, and main into this release's branch, before the next
      # is cut: main then holds each tagged commit, and the commit released carries every earlier fix. The
      # version's own tag is this release resumed.
      - name: Check every earlier release is in main and in the commit
        run: |
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tags="$(git for-each-ref --format='%(refname:strip=2)' refs/tags)"
          for tag in $(printf '%s\n' "$tags" | { grep -E "$release" || true; }); do
            if [ "$tag" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$tag" "$VERSION" | sort -V | head -n 1)" = "$tag" ]; then
              if ! git merge-base --is-ancestor "refs/tags/$tag^{commit}" refs/remotes/origin/main; then
                echo "::error::release $tag is not in main: its release or hotfix branch has not merged back with a merge commit"
                exit 1
              fi
              if ! git merge-base --is-ancestor "refs/tags/$tag^{commit}" "$COMMIT"; then
                echo "::error::release $tag is not in $COMMIT: merge main into the branch and pass CI there before cutting $VERSION"
                exit 1
              fi
            fi
          done

  # The suite, on its own so a failed test is re-run without rebuilding the XCFrameworks.
  test:
    name: Test the release
    needs: check
    # The same image as the build job, so the release is tested on the Xcode it
    # builds its XCFrameworks with.
    runs-on: xcode-27
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      # The running commit, so the target checkout's older action copy is not
      # the one this job runs.
      - uses: $/.github/actions/ios-toolchain
        with:
          xcode: default

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Test
        run: |
          # The same hardware-only exclusions every other workflow that tests this scheme applies, from
          # the same file. The release tags what this job tested, so without them a release is cut off a
          # run that reported standing skips.
          # The status is checked before the output is parsed. `read` succeeds on a here-string
          # whatever the command substitution inside it returned, so the failure would be dropped and
          # the array left empty: the step would then run the hardware-only tests with no exclusions
          # and pass, which is the silent skip this whole list exists to prevent. Fail closed.
          if ! exclusions="$(.github/scripts/hardware-only-skips.sh)"; then
              echo "::error::the hardware-only exclusion list could not be read"
              exit 1
          fi
          # Into an array rather than expanded unquoted, so the arguments split exactly where the list
          # says and nowhere else. An empty list leaves an empty array, which expands to nothing.
          read -r -a skips <<< "$exclusions"
          xcodebuild test \
            -scheme PayabliSDK-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -clonedSourcePackagesDirPath .build/checkouts \
            ${skips[@]+"${skips[@]}"} \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

  # The XCFrameworks, beside the suite rather than after it. Publish uploads what this job built, so a re-run
  # of the suite alone leaves them as they are.
  build:
    name: Build the release
    needs: check
    # The XCFramework build needs this image's default Xcode; the test job runs
    # on the same image so a release is gated on the Xcode it builds with.
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      # The running commit, so the target checkout's older action copy is not
      # the one this job runs.
      - uses: $/.github/actions/ios-toolchain
        with:
          xcode: default

      - name: Build the XCFrameworks
        timeout-minutes: 45
        run: ./Scripts/build_release_frameworks.sh

      # Every module this release ships has a record in API/, and its interface matches it. Read from the build
      # above: each module's private interface, which the release script strips from the frameworks. A mismatch
      # fails this job, which publish needs; the repair is a reviewed pull request that regenerates API/.
      - name: Check the shipped interface matches API/
        run: |
          set -euo pipefail
          if [ ! -x Scripts/dump-public-interface.sh ] || [ ! -d API ]; then
            echo "::error::this commit has no recorded interface, so what it ships cannot be checked"
            exit 1
          fi
          shipped="$(cd build/release/xcframeworks && ls -d -- *.xcframework | sed 's/\.xcframework$//' | sort)"
          recorded="$(cd API && ls -- *.swiftinterface | sed 's/\.swiftinterface$//' | sort)"
          if [ "$shipped" != "$recorded" ]; then
            echo "::error::the release ships $(echo $shipped) and API/ records $(echo $recorded)"
            exit 1
          fi
          ./Scripts/dump-public-interface.sh \
            --products build/release/derived-device/Build/Products/Release-iphoneos \
            "$RUNNER_TEMP/interface"
          if ! diff -ru API "$RUNNER_TEMP/interface"; then
            echo "::error::the interface this release ships differs from API/; regenerate API/ in a reviewed pull request"
            exit 1
          fi
          # Each simulator slice is held to the same record. Its target's architecture and simulator suffix are the
          # only difference, so both sides drop them and every other module flag is compared.
          untargeted() { sed -E '/^\/\/ swift-module-flags:/s/-target [a-z0-9_]+-apple-ios([0-9.]+)(-simulator)? /-target apple-ios\1 /' "$1"; }
          sim=build/release/derived-sim/Build/Products/Release-iphonesimulator
          triples="$(find "$sim" -path '*/PayabliSDKCore.swiftmodule/*-apple-ios-simulator.private.swiftinterface' \
            -exec basename {} .private.swiftinterface \; | sort)"
          if [ -z "$triples" ]; then
            echo "::error::the simulator build wrote no interface to check"
            exit 1
          fi
          for triple in $triples; do
            ./Scripts/dump-public-interface.sh --products "$sim" --triple "$triple" "$RUNNER_TEMP/interface-$triple"
            for record in API/*.swiftinterface; do
              if ! diff -u <(untargeted "$record") \
                  <(untargeted "$RUNNER_TEMP/interface-$triple/$(basename "$record")"); then
                echo "::error::the $triple slice's interface differs from $record"
                exit 1
              fi
            done
          done

      # Kept past the 30 days in which GitHub allows a run to be re-run, so a re-run of the suite still finds
      # these files to publish. Replaced when this job itself is re-run, since an artifact name is written once.
      - name: Hand the release files to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            build/release/payabli-ios-sdk-${{ needs.check.outputs.version }}.zip
            build/release/checksums.txt
            build/release/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  publish:
    name: Publish a release
    needs: [check, test, build]
    runs-on: ubuntu-latest
    # Its required reviewers are who may release, it deploys from main only, and it holds the one key the
    # tag ruleset lets create a tag.
    environment: release
    # One publish at a time, and none cancelled. Two releases check, test and build side by side, and each
    # checks the newest release and the tag again just before tagging.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write

    env:
      # Through the environment, so the text is never parsed as shell.
      RELEASE_NOTES: ${{ inputs.release_notes }}
      BUILT_VERSION: ${{ needs.check.outputs.version }}
      COMMIT: ${{ needs.check.outputs.commit }}

    steps:
      - name: Check the release key is provisioned
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::the release environment has no RELEASE_DEPLOY_KEY secret"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      # The version is the check job's output, set before any test or build ran. It and the commit are
      # checked here as data, since no file from the checkout runs where the key is.
      - name: Check the version
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the build reported '$COMMIT', which is not a full commit SHA"
            exit 1
          fi
          if ! [[ "$BUILT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the build reported '$BUILT_VERSION', which is not <major>.<minor>.<patch>"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a release is cut from refs/heads/main, not $GITHUB_REF"
            exit 1
          fi
          VERSION="$BUILT_VERSION"
          tagged="$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}" || true)"
          if [ -n "$tagged" ] && [ "$tagged" != "$COMMIT" ]; then
            echo "::error::tag $VERSION already names $tagged, not $COMMIT"
            exit 1
          fi
          # "Re-run failed jobs" does not re-run the check job, so a release cut since it ran is looked for
          # here. The same lines as release-newer.sh.
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tags="$(git for-each-ref --format='%(refname:strip=2)' refs/tags)"
          newest="$(printf '%s\n' "$tags" | { grep -E "$release" || true; } | sort -V | tail -n 1)"
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::the newest release is $newest, and $VERSION is lower"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAGGED=$tagged" >> "$GITHUB_ENV"

      # Again here, with refs fetched after the approval: an earlier release cut while this one waited is not
      # in main yet, and this commit does not hold it. The same lines as the check job's step.
      - name: Check again that every earlier release is in main and in the commit
        run: |
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tags="$(git for-each-ref --format='%(refname:strip=2)' refs/tags)"
          for tag in $(printf '%s\n' "$tags" | { grep -E "$release" || true; }); do
            if [ "$tag" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$tag" "$VERSION" | sort -V | head -n 1)" = "$tag" ]; then
              if ! git merge-base --is-ancestor "refs/tags/$tag^{commit}" refs/remotes/origin/main; then
                echo "::error::release $tag is not in main: its release or hotfix branch has not merged back with a merge commit"
                exit 1
              fi
              if ! git merge-base --is-ancestor "refs/tags/$tag^{commit}" "$COMMIT"; then
                echo "::error::release $tag is not in $COMMIT: merge main into the branch and pass CI there before cutting $VERSION"
                exit 1
              fi
            fi
          done

      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: build/release

      # A draft carries the assets and needs no tag. The tag is then pushed with the deploy key, the only
      # identity the tag ruleset lets create one, and the draft is published onto it. A run that failed part
      # way is resumed: a draft on this commit gets its assets again, a tag on this commit is not pushed
      # twice, and a published release or a draft on another commit is refused.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          bundle="build/release/payabli-ios-sdk-$VERSION.zip"
          if [ ! -f "$bundle" ]; then
            echo "::error::no $bundle"
            exit 1
          fi
          assets=("$bundle" build/release/checksums.txt build/release/THIRD_PARTY_LICENSES.txt)
          if ! existing="$(gh release view "$VERSION" --json isDraft,targetCommitish \
              --jq '"\(.isDraft) \(.targetCommitish)"' 2>&1)"; then
            case "$existing" in
              *"release not found"*) existing="" ;;
              *) echo "::error::could not read release $VERSION: $existing"; exit 1 ;;
            esac
          fi
          case "$existing" in
            "")
              gh release create "$VERSION" --draft --target "$COMMIT" \
                --title "Payabli iOS SDK $VERSION" --notes-file release-notes.md "${assets[@]}"
              ;;
            "true $COMMIT")
              # The draft carries the notes this run wrote, whichever attempt created it.
              gh release edit "$VERSION" --notes-file release-notes.md
              gh release upload "$VERSION" --clobber "${assets[@]}"
              ;;
            "false "*)
              echo "::error::release $VERSION is already published"
              exit 1
              ;;
            *)
              echo "::error::draft $VERSION targets '${existing#* }', not $COMMIT; delete it"
              exit 1
              ;;
          esac

          # GitHub's host keys come from its API over HTTPS, so the SSH connection is verified rather than
          # trusted on first use.
          umask 077
          key="$RUNNER_TEMP/release-key"
          hosts="$RUNNER_TEMP/github-known-hosts"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$TAGGED" ]; then
            git tag -a "$VERSION" -m "Payabli iOS SDK $VERSION" "$COMMIT"
            GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts" \
              git push "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/$VERSION"
          fi

          gh release edit "$VERSION" --draft=false
