name: Source branch

# main holds only what has been released, so it takes pull requests from release and hotfix branches, and
# from Dependabot, whose bumps are proved on main where they land. A ruleset can require a check but cannot
# name a pull request's source branch, so this job is the mechanism, made a required check on main. It reads
# the event and nothing in the repository, so it checks nothing out and holds no token.

on:
  pull_request:
    branches: [main]
    # `edited` as well, so a pull request retargeted to main is checked on the retarget.
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  source:
    name: Source branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Through the environment, so a branch name is never parsed as shell.
      - name: Check the pull request comes from a release or hotfix branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/?*|hotfix/?*|dependabot/?*) ;;
            *)
              echo "::error::main takes pull requests from release/, hotfix/ and dependabot/ branches only, not '$HEAD_REF'"
              exit 1
              ;;
          esac
