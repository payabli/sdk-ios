name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications | grep -E '^Xcode_[0-9]' | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE"
          echo "Using $XCODE"
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme PayabliTTP \
            -clonedSourcePackagesDirPath .build/checkouts

      - name: Test
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          iphones = [
            v for k, vals in d.items()
            if 'iOS' in k
            for v in vals
            if 'iPhone' in v['name'] and v['isAvailable']
          ]
          print(sorted(iphones, key=lambda x: x['name'])[-1]['udid'])
          ")
          echo "Using simulator: $SIMULATOR_ID"
          xcodebuild test \
            -scheme PayabliTTP \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -clonedSourcePackagesDirPath .build/checkouts \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
