name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three jobs, run at once. The two suites are the whole cost of this workflow
# and neither reads anything the other writes, so run in sequence they only add
# up. They cannot share a build: both compile the SDK, but one is the package's
# own test action and the other consumes the package as a dependency of
# Example/PayabliDemo.xcodeproj, and Xcode compiles a dependency with
# -suppress-warnings. Same intermediates path, different flags, so pointing both
# at one -derivedDataPath makes them invalidate each other's objects rather than
# reuse them.

jobs:
  lint:
    name: Lint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/lint-tools

      # No `--config`: naming a config file makes SwiftLint ignore nested ones,
      # and Tests/.swiftlint.yml is what relaxes the rules XCTest fixtures break.
      - name: Lint
        run: |
          swiftlint
          swiftformat --lint .

  # Reports, never judges. A branch that runs `swiftformat .` puts hundreds of
  # files in the diff, and the file count alone does not say which of them
  # changed what the code does.
  #
  # continue-on-error, and the script exits 0 whatever it finds: a report that
  # can redden a pull request is a gate, and this is not one.
  #
  # This job runs the pull request's own code — the local action and the script
  # under Scripts/ — so it is read-only and holds no token worth taking. The
  # comment is posted by the job below, which runs none of it. A step can
  # prepend to $GITHUB_PATH for the steps after it, so code from the branch and
  # a write token in one job means the code can wrap `gh` and read the token out
  # of the environment when the later step calls it.
  changes:
    name: Change report
    runs-on: macos-15
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: read

    steps:
      # The classification reads both sides of the change, so it needs history.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/lint-tools

      - name: Classify the diff
        run: |
          ./Scripts/classify-changes.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: change-report
          path: report.md

  # Holds the write token and runs nothing from the pull request: no checkout,
  # no local action, no script from the branch. `gh` and `jq` come from the
  # runner image, and the report arrives as an artifact, which is data.
  #
  # ubuntu, because nothing here needs Xcode, and a macOS runner bills at ten
  # times the rate for a step that posts one comment.
  changes-comment:
    name: Change report comment
    runs-on: ubuntu-latest
    needs: [changes]
    # A fork's pull request gets a read-only token, so skip it there rather than
    # let it fail. `continue-on-error` used to cover that case, on the job and on
    # the step, which made every outcome green: a report that had stopped posting
    # was indistinguishable from one that posted. Skipping the case that cannot
    # work leaves a same-repository failure loud.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write

    steps:
      - name: Download the report
        uses: actions/download-artifact@v4
        with:
          name: change-report

      # One comment that is edited in place, found by the marker the script
      # writes. A new comment on every push buries the review under reports of
      # itself. A fork's pull request has a read-only token, so this is allowed
      # to fail without taking the job with it.
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # jq slurps the pages into one array. --jq would run once per page, so
          # `last` would be the last match on the last page and not overall.
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -s 'add | map(select(.body | contains("<!-- change-report -->"))) | last | .id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@report.md >/dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@report.md >/dev/null
            echo "posted a new comment"
          fi

  test-sdk:
    name: SDK tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/ios-toolchain

      - name: Test the SDK
        run: |
          xcodebuild test \
            -scheme PayabliSDK-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -clonedSourcePackagesDirPath .build/checkouts \
            -enableCodeCoverage YES \
            -resultBundlePath SDKTests.xcresult \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      # -quiet names the failing tests and stops there, so the assertion comes
      # back out of the result bundle.
      - name: Report test failures
        if: failure()
        run: ./Scripts/print-test-failures.sh SDKTests.xcresult

      # Sources only. sonar-project.properties measures that root, and an
      # .xcresult also covers the test files themselves and the vendored
      # card-reader source the suite touches.
      - name: Convert coverage
        run: |
          ./Scripts/xccov-to-sonarqube-generic.sh --include Sources/ \
            SDKTests.xcresult > coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  test-demo:
    name: Sample app step sequences
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/ios-toolchain

      # The sample app's step sequences, which decide what each screen offers
      # next. A separate scheme, because this bundle has no host application:
      # Secrets.swift is gitignored and is a member of the app target, so the app
      # itself cannot be built here.
      - name: Test the sample app's step sequences
        run: |
          xcodebuild test \
            -project Example/PayabliDemo/PayabliDemo.xcodeproj \
            -scheme PayabliDemoFlowTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -clonedSourcePackagesDirPath .build/checkouts \
            -enableCodeCoverage YES \
            -resultBundlePath DemoFlowTests.xcresult \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Report test failures
        if: failure()
        run: ./Scripts/print-test-failures.sh DemoFlowTests.xcresult

  sonar:
    name: SonarCloud
    runs-on: macos-15
    # Only the SDK suite's coverage is analysed, so this does not wait on the
    # sample app.
    needs: [test-sdk]
    # A fork's pull request has no access to the token, and the scan would fail
    # rather than be skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Analysis reads the git history to decide what is new code.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage

      # Pinned to a commit, not a tag. `v5` is mutable, and this step is handed
      # SONAR_TOKEN, so a replaced action would hold a repository secret. Same
      # reasoning as the checksummed tool downloads above.
      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
