# Keeps the action references current.
#
# Every workflow names another repository's action by a commit, and a pinned SHA ages silently: GitHub does
# not announce a new release to a workflow that names a commit. This is what turns a release into a pull
# request, and it maintains the trailing version comment beside each SHA.
#
# Scoped to actions alone. The package declares no dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request for every action that moved, rather than one each.
    groups:
      actions:
        patterns:
          - "*"
