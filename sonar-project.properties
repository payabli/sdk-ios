sonar.projectKey=payabli_sdk-ios
sonar.organization=payabli
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# The SDK, and nothing else. Example/ is the sample app, Bridges/ holds the
# Flutter, MAUI and React Native wrappers, and ThirdParty/ is vendored
# Fiserv/TTPPackage source that is byte-identical to upstream and may not be
# edited. None of them is what this project measures, and naming Sources and
# Tests alone keeps their issues and their uncovered lines out of the SDK's
# numbers.
sonar.sources=Sources
sonar.tests=Tests

# Coverage only, so these still get issue detection. A SwiftUI view needs a
# rendering pass, so no unit test reaches its body, and TestUtils is fixtures
# that the suites exercise rather than target.
sonar.coverage.exclusions=Sources/PayabliSDKPayInPaymentFlow/**View.swift,Sources/PayabliSDKTestUtils/**

# Written by Scripts/xccov-to-sonarqube-generic.sh from the SDK .xcresult bundle.
sonar.coverageReportPaths=coverage.xml
