sonar.projectKey=payabli_sdk-ios
sonar.organization=payabli
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# The SDK, and nothing else. Example/ is the sample app, Bridges/ holds the
# Flutter, MAUI and React Native wrappers, and ThirdParty/ is vendored
# Fiserv/TTPPackage source that is byte-identical to upstream and may not be
# edited. None of them is what this project measures, and naming Sources and
# Tests alone keeps their issues and their uncovered lines out of the SDK's
# numbers.
sonar.sources=Sources
sonar.tests=Tests

# Coverage only, so these still get issue detection. TestUtils is fixtures that the
# suites exercise rather than target.
#
# The SwiftUI views used to be excluded here on the reasoning that a view needs a
# rendering pass, so no unit test reaches its body. Measured against the suite's own
# result bundle, that is not true of this tree: PayabliPayInPaymentFlowView.swift is
# 678 of 870 lines covered. The entry was hiding those lines rather than excluding
# unreachable ones. If a view genuinely cannot be reached, exclude that file and say
# which measurement showed it.
sonar.coverage.exclusions=Sources/PayabliSDKTestUtils/**

# Written by Scripts/xccov-to-sonarqube-generic.sh from the SDK .xcresult bundle.
sonar.coverageReportPaths=coverage.xml
