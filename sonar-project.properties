sonar.projectKey=payabli_sdk-ios
sonar.organization=payabli
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=Sources,Example/PayabliDemo
sonar.tests=Tests,Example/PayabliDemo/FlowTests

# Vendored Fiserv/TTPPackage source, byte-identical to upstream. Analysing it
# would report issues nobody here may fix: the vendoring contract in
# ThirdParty/PayabliCardReaderCoreSource/README.md forbids editing the file.
#
# Bridges/ holds the Flutter, MAUI and React Native wrappers, which SPM does not
# build and CI does not compile.
sonar.exclusions=ThirdParty/**,Bridges/**,**/build/**,.build/**

# Coverage only, so these still get issue detection.
#
# A SwiftUI View needs a rendering pass, so no unit test reaches its body, and
# the sample app is views apart from Flow/. Flow/ is where every step decision
# lives and is covered by PayabliDemoFlowTests; the directories below are what
# is left, which is why this is a directory rule rather than a list of files.
# The SDK's own form component is the same case.
sonar.coverage.exclusions=\
  Example/PayabliDemo/App/**,\
  Example/PayabliDemo/Configuration/**,\
  Example/PayabliDemo/Debug/**,\
  Example/PayabliDemo/Diagnostics/**,\
  Example/PayabliDemo/PayIn/**,\
  Example/PayabliDemo/Shared/**,\
  Example/PayabliDemo/TapToPay/**,\
  Example/PayabliDemo/Theme/**,\
  Sources/PayabliSDKPayInPaymentFlow/**View.swift,\
  Sources/PayabliSDKTestUtils/**

# Written by Scripts/xccov-to-sonarqube-generic.sh from both .xcresult bundles.
sonar.coverageReportPaths=coverage.xml
